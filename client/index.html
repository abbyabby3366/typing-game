<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBER CLASH // 3D Tug-of-War Typing Duel</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- 3D Three.js WebGL Canvas -->
    <canvas id="three-canvas"></canvas>

    <!-- CRT / Holographic Scanline Overlay -->
    <div class="crt-overlay"></div>

    <!-- Main UI Root Overlay -->
    <div id="app">
      <!-- Top Cyber Status Bar -->
      <header id="top-bar">
        <div class="brand">
          <span class="brand-badge">PROTOTYPE V1.0</span>
          <h1 class="brand-title">CYBER<span class="text-cyan">CLASH</span></h1>
        </div>
        <div class="top-actions">
          <div id="connection-status" class="status-pill status-disconnected">
            <span class="status-dot"></span>
            <span class="status-text">CONNECTING</span>
          </div>
          <button id="telemetry-open-btn" class="cyber-btn-icon" title="Pilot Career Telemetry & Match Log">
            <svg class="cyber-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </button>
          <button id="keyclick-toggle-btn" class="cyber-btn-icon" title="Toggle Mechanical Switch Key Clicks">
            <span id="keyclick-icon"><svg class="cyber-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="M6 8h.001M10 8h.001M14 8h.001M18 8h.001M8 12h.001M12 12h.001M16 12h.001M7 16h10"></path></svg></span>
          </button>
          <button id="audio-toggle-btn" class="cyber-btn-icon" title="Toggle Audio (Procedural Web Audio Engine)">
            <span id="audio-icon"><svg class="cyber-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></span>
          </button>
        </div>
      </header>

      <!-- Main Dynamic View Container -->
      <main id="main-view"></main>

      <!-- Global Alert / Toast Notification Center -->
      <div id="toast-container" class="toast-container" aria-live="polite"></div>

      <!-- Global Modal Container (Confirmations & Results) -->
      <div id="modal-container" class="modal-overlay hidden"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
